name: Security CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-ci:
    name: Security regression and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SQUAD_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Verify toolchain
        run: |
          test "$(node --version)" = v22.23.4
          test "$(npm --version)" = 10.9.9
          "$SQUAD_TEST_PG_BIN/pg_ctl" --version | grep -E 'PostgreSQL\) 16\.'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Security regressions and isolated database
        timeout-minutes: 4
        run: npm run test:security
      - name: Lint
        run: npm run lint
      - name: Build and typecheck with synthetic configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
        run: npm run build
